name: Build and Release MyMCP Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. v1.0.0)'
        required: false
        default: ''
        type: string
      release_type:
        description: 'Release publishing type'
        required: true
        default: 'artifacts'
        type: choice
        options:
          - stable
          - prerelease
          - artifacts

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Tests
        run: go test -v ./...

  build-and-release:
    name: Cross-Compile and Publish Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get Version Tag
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
            if [ "$VERSION" = "$GITHUB_REF" ]; then
              VERSION="v0.1.0-test"
            fi
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Build version is $VERSION"

      - name: Build Binaries
        run: |
          mkdir -p build dist
          
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/mymcp-linux-amd64 .
          tar -czvf dist/mymcp-linux-amd64-${{ env.VERSION }}.tar.gz -C build mymcp-linux-amd64
          
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/mymcp-linux-arm64 .
          tar -czvf dist/mymcp-linux-arm64-${{ env.VERSION }}.tar.gz -C build mymcp-linux-arm64
          
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/mymcp-windows-amd64.exe .
          zip -j dist/mymcp-windows-amd64-${{ env.VERSION }}.zip build/mymcp-windows-amd64.exe
          
          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/mymcp-darwin-amd64 .
          tar -czvf dist/mymcp-darwin-amd64-${{ env.VERSION }}.tar.gz -C build mymcp-darwin-amd64
          
          # macOS arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/mymcp-darwin-arm64 .
          tar -czvf dist/mymcp-darwin-arm64-${{ env.VERSION }}.tar.gz -C build mymcp-darwin-arm64

      - name: Determine Prerelease and Release Flags
        id: flags
        run: |
          REL_TYPE="${{ github.event.inputs.release_type }}"
          
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Automatic tag push defaults to release publication
            DO_RELEASE="true"
            if [[ "${{ env.VERSION }}" == *"-beta"* ]] || [[ "${{ env.VERSION }}" == *"-rc"* ]] || [[ "${{ env.VERSION }}" == *"-alpha"* ]] || [[ "${{ env.VERSION }}" == *"-test"* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          else
            # Manual workflow dispatch input determines behavior
            if [ "$REL_TYPE" = "artifacts" ]; then
              DO_RELEASE="false"
              IS_PRERELEASE="false"
            elif [ "$REL_TYPE" = "prerelease" ]; then
              DO_RELEASE="true"
              IS_PRERELEASE="true"
            else
              # stable
              DO_RELEASE="true"
              IS_PRERELEASE="false"
            fi
          fi
          echo "DO_RELEASE=$DO_RELEASE" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "Release publishing: $DO_RELEASE (prerelease: $IS_PRERELEASE)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mymcp-binaries-${{ env.VERSION }}
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ env.DO_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: MyMCP Server Release ${{ env.VERSION }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
